<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Class Title</title>
    </h:head>
    <h:body>
        <div class="classes-table-header" style="text-align: center; font-weight: bold;">
            <h1>Classes Info</h1>
        </div>
        <div class="card crud-test">
            <h:form id="form">
                <p:growl id="messages" showDetail="true" globalOnly="true" />

                <p:toolbar style="display: flex; justify-content: space-between">
                    <p:toolbarGroup>
                        <p:commandButton value="Add Class" icon="pi pi-plus"
                                         actionListener="#{classManagedBean.open()}"
                                         update=":dialogs:manage-class-content"
                                         oncomplete="PF('manageClassDialog').show()"
                                         styleClass="ui-button-success"
                                         style="margin-right: .5rem">
                            <p:resetInput target=":dialogs:manage-class-content" />
                        </p:commandButton>   
                        <p:commandButton value="View Students" icon="pi pi-users"
                                         action="student.xhtml?faces-redirect=true"
                                         styleClass="ui-button-success"
                                         style="float: right"
                                         update="form:messages form:dt-classes"
                                         process="@this" />
                        <p:commandButton value="Xlsx"
                                         icon="pi pi-download"
                                         actionListener="#{classManagedBean.exportExcel()}"
                                         ajax="false"
                                         styleClass="ui-button-success"
                                         style="margin-left: .5rem">
                            <p:fileDownload value="#{classManagedBean.file}" />
                        </p:commandButton>
                        <p:commandButton value="Vsdx"
                                         icon="pi pi-download"
                                         actionListener="#{classManagedBean.exportWord()}"
                                         ajax="false"
                                         styleClass="ui-button-success"
                                         style="margin-left: .5rem">
                            <p:fileDownload value="#{classManagedBean.file}" />
                        </p:commandButton>
                        <p:commandButton value="Send Email"
                                         icon="pi pi-envelope"
                                         action="#{classManagedBean.sendEmailWithExcel}"
                                         update="form:messages"
                                         styleClass="ui-button-success" 
                                         style="margin-left: .5rem"/>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="dt-classes" widgetVar="dtClasses" var="class"
                             value="#{classManagedBean.classList}" reflow="true" rowIndexVar="indx"
                             styleClass="classes-table" rowKey="#{class.roomID}"
                             paginator="true" rows="7" paginatorPosition="bottom" selectionMode="single">

                    <p:column headerText="Index">
                        <h:outputText value="#{indx + 1}" />
                    </p:column>

                    <p:column headerText="Class Name" sortBy="#{class.roomName}" filterBy="#{class.roomName}">
                        <h:outputText value="#{class.roomName}" />
                    </p:column>
                    <p:column headerText="Class Description" sortBy="#{class.roomDescription}" filterBy="#{class.roomDescription}">
                        <h:outputText value="#{class.roomDescription}" />
                    </p:column>
                    <p:column exportable="false" ariaHeaderText="Actions" >
                        <p:commandButton class="ui-button-warning rounded-button" icon="pi pi-trash"
                                         process="@this"
                                         oncomplete="PF('deleteClassDialog').show()"
                                         actionListener="#{classManagedBean.prepareToDelete(class)}"
                                         update=":dialogs:delete-confirm-content">
                        </p:commandButton>
                    </p:column>
                    <p:column>
                        <p:commandButton icon="pi pi-pencil"
                                         actionListener="#{classManagedBean.loadClass(class)}"
                                         update=":dialogs:manage-class-content"
                                         styleClass="edit-button rounded-button ui-button-success"
                                         oncomplete="PF('manageClassDialog').show()">
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </h:form>

            <h:form id="dialogs">
                <p:dialog header="Class Info" showEffect="fade" modal="true"
                          widgetVar="manageClassDialog" responsive="true">
                    <p:outputPanel id="manage-class-content" class="ui-fluid">
                        <p:outputPanel rendered="#{not empty classManagedBean.selectedClass}">
                            <div class="field">
                                <p:outputLabel for="name">Name</p:outputLabel>
                                <p:inputText id="name" value="#{classManagedBean.selectedClass.roomName}"
                                             required="true" />
                            </div>
                            <div class="field">
                                <p:outputLabel for="desc">Description</p:outputLabel>
                                <p:inputText id="desc" value="#{classManagedBean.selectedClass.roomDescription}"
                                             required="true" />
                            </div>
                        </p:outputPanel>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton value="Save" icon="pi pi-check"
                                         actionListener="#{classManagedBean.saveOrUpdateClass()}"
                                         update="form:messages form:dt-classes dialogs:manage-class-content"
                                         process="manage-class-content @this" />
                        <p:commandButton value="Cancel" icon="pi pi-times"
                                         onclick="PF('manageClassDialog').hide()"
                                         class="ui-button-secondary" type="button" />
                    </f:facet>
                </p:dialog>
                <p:confirmDialog id="delete-confirm-content" widgetVar="deleteClassDialog" showEffect="fade" hideEffect="fade"
                                 header="Confirm Delete" message="Are you sure you want to delete this class?" severity="warn">


                    <p:commandButton value="Yes" icon="pi pi-check"
                                     actionListener="#{classManagedBean.deleteClass()}"
                                     process="@this"
                                     update="form:messages form:dt-classes"
                                     oncomplete="PF('deleteClassDialog').hide()" />

                    <p:commandButton value="No" icon="pi pi-times"
                                     onclick="PF('deleteClassDialog').hide()"
                                     type="button"
                                     class="ui-button-secondary" />
                </p:confirmDialog>
            </h:form>
        </div>
    </h:body>
</html>
