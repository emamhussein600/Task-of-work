<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Student Info</title>
    </h:head>
    <h:body>
        <div class="classes-table-header" style="text-align: center; font-weight: bold;">
            <h1>Student Info</h1>
        </div>

        <div class="card crud-test">
            <h:form id="form">
                <p:growl id="messages" showDetail="true" globalOnly="false" />

                <p:toolbar>
                    <p:toolbarGroup>
                        <p:commandButton value="Add Student"
                                         icon="pi pi-plus"
                                         actionListener="#{studentManagedBean.open()}"
                                         update=":dialogs:manage-student-content"
                                         oncomplete="PF('manageStudentDialog').show()"
                                         styleClass="ui-button-success"
                                         style="margin-right: .5rem">
                            <p:resetInput target=":dialogs:manage-student-content" />
                        </p:commandButton>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="dt-students"
                             widgetVar="dtStudents"
                             var="student"
                             value="#{studentManagedBean.studentList}"
                             reflow="true"
                             styleClass="students-table"
                             rowKey="#{student.studentID}"
                             paginator="true"
                             selectionMode="add"
                             rows="7"
                             paginatorPosition="bottom">

                    <p:column>
                        <h:outputText value="#{studentManagedBean.studentList.indexOf(student) + 1}" />
                    </p:column>

                    <p:column headerText="Student Name"
                              sortBy="#{student.studentName}"
                              filterBy="#{student.studentName}">
                        <h:outputText value="#{student.studentName}" />
                    </p:column>

                    <p:column headerText="Gender"
                              sortBy="#{student.gender}"
                              filterBy="#{student.gender}">
                        <h:outputText value="#{student.gender}" />
                    </p:column>

                    <p:column headerText="Class Name"
                              sortBy="#{student.roomID.roomName}"
                              filterBy="#{student.roomID.roomName}">
                        <h:outputText value="#{student.roomID.roomName}" />
                    </p:column>

                    <!-- DELETE BUTTON WITH CONFIRMATION -->
                    <p:column exportable="false" ariaHeaderText="Actions">
                        <p:commandButton icon="pi pi-trash"
                                         class="ui-button-warning rounded-button"
                                         actionListener="#{studentManagedBean.setSelectedStudent(student)}"
                                         oncomplete="PF('deleteStudentDialog').show()"
                                         process="@this"
                                         />
                    </p:column>

                    <!-- EDIT BUTTON -->
                    <p:column>
                        <p:commandButton icon="pi pi-pencil"
                                         actionListener="#{studentManagedBean.loadStudent(student)}"
                                         update=":dialogs:manage-student-content"
                                         oncomplete="PF('manageStudentDialog').show()"
                                         styleClass="edit-button rounded-button ui-button-success"
                                         process="@this" />
                    </p:column>
                </p:dataTable>
            </h:form>

            <!-- DIALOGS -->
            <h:form id="dialogs">
                <!-- Add/Edit Dialog -->
                <p:dialog header="Student Info"
                          widgetVar="manageStudentDialog"
                          modal="true"
                          responsive="true"
                          showEffect="fade">

                    <p:outputPanel id="manage-student-content" class="ui-fluid">
                        <p:outputPanel rendered="#{not empty studentManagedBean.selectedStudent}">

                            <div class="field">
                                <p:outputLabel for="name">Name</p:outputLabel>
                                <p:inputText id="name"
                                             value="#{studentManagedBean.selectedStudent.studentName}"
                                             required="true" />
                            </div>

                            <div class="field">
                                <p:outputLabel for="gender">Gender</p:outputLabel>
                                <p:inputText id="gender"
                                             value="#{studentManagedBean.selectedStudent.gender}"
                                             required="true" />
                            </div>

                            <div class="field">
                                <p:outputLabel for="roomName">Room Name</p:outputLabel>
                                <p:selectOneMenu id="roomName"
                                                 value="#{studentManagedBean.selectedStudent.roomID}"
                                                 converter="entityConverter"
                                                 required="true"
                                                 label="Select Class">
                                    <f:selectItem itemLabel="-- Select Class --"
                                                  itemValue="#{null}"
                                                  noSelectionOption="true"/>
                                    <f:selectItems value="#{studentManagedBean.classList}"
                                                   var="cls"
                                                   itemLabel="#{cls.roomName}"
                                                   itemValue="#{cls}" /> 
                                </p:selectOneMenu>
                            </div>

                        </p:outputPanel>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton value="Save"
                                         icon="pi pi-check"
                                         action="#{studentManagedBean.saveOrUpdateStudent}"
                                         update="form:messages form:dt-students dialogs:manage-student-content"
                                         process="manage-student-content @this" />
                        <p:commandButton value="Cancel"
                                         icon="pi pi-times"
                                         onclick="PF('manageStudentDialog').hide()"
                                         styleClass="ui-button-secondary"
                                         type="button" />
                    </f:facet>

                </p:dialog>
                <p:confirmDialog id="delete-confirm-content" widgetVar="deleteStudentDialog" showEffect="fade" hideEffect="fade"
                                 header="Confirm Delete" message="Are you sure you want to delete student of this class?" severity="warn">


                    <p:commandButton value="Yes" icon="pi pi-check"
                                     actionListener="#{studentManagedBean.deleteStudent(studentManagedBean.selectedStudent)}"
                                     process="@this"
                                     update="form:messages form:dt-students"
                                     oncomplete="PF('deleteStudentDialog').hide()" />

                    <p:commandButton value="No" icon="pi pi-times"
                                     onclick="PF('deleteStudentDialog').hide()"
                                     type="button"
                                     class="ui-button-secondary" />
                </p:confirmDialog>

            </h:form>
        </div>
    </h:body>
</html>
